---
- name: Install CA trust packages on RHEL-family systems
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - openssl
    state: present

- name: Ensure RHEL trust anchors directory exists
  ansible.builtin.file:
    path: /etc/pki/ca-trust/source/anchors
    state: directory
    owner: root
    group: root
    mode: '0755'
