---
- name: Install CA certificate from URL on RHEL-family systems
  ansible.builtin.get_url:
    url: "{{ item.src if item is mapping else item }}"
    dest: "/etc/pki/ca-trust/source/anchors/{{ item.dest_name | default((item.src if item is mapping else item) | basename) }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ ca_certificates }}"
  when: (item.src if item is mapping else item) is match('^https?://')
  notify: Update CA certificates (RedHat)

- name: Install CA certificate from controller on RHEL-family systems
  ansible.builtin.copy:
    src: "{{ item.src if item is mapping else item }}"
    dest: "/etc/pki/ca-trust/source/anchors/{{ item.dest_name | default((item.src if item is mapping else item) | basename) }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ ca_certificates }}"
  when: not ((item.src if item is mapping else item) is match('^https?://'))
  notify: Update CA certificates (RedHat)
