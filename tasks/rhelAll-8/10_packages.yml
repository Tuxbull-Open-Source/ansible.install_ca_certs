---
- name: Install CA trust packages on RHEL 8
  ansible.builtin.command:
    argv: [dnf, -y, install, ca-certificates, openssl]
  register: ca_rhel8_packages
  changed_when: "'Nothing to do.' not in ca_rhel8_packages.stdout"
  until: ca_rhel8_packages is not failed

- name: Ensure RHEL 8 trust anchors directory exists
  ansible.builtin.file:
    path: /etc/pki/ca-trust/source/anchors
    state: directory
    owner: root
    group: root
    mode: '0755'
