---
- name: Install CA trust packages on Debian-family systems
  ansible.builtin.apt:
    name:
      - ca-certificates
      - openssl
    state: present
    update_cache: true

- name: Ensure Debian trust anchors directory exists
  ansible.builtin.file:
    path: /usr/local/share/ca-certificates
    state: directory
    owner: root
    group: root
    mode: '0755'
