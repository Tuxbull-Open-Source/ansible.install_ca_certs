---
- name: Install CA certificate from URL on Debian-family systems
  vars:
    ca_source: "{{ item.src if item is mapping else item }}"
    ca_name: "{{ item.dest_name | default(ca_source | basename) }}"
  ansible.builtin.get_url:
    url: "{{ ca_source }}"
    dest: "/usr/local/share/ca-certificates/{{ ca_name }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ ca_certificates }}"
  when: ca_source is match('^https?://')
  notify: Update CA certificates (Debian)

- name: Install CA certificate from controller on Debian-family systems
  vars:
    ca_source: "{{ item.src if item is mapping else item }}"
    ca_name: "{{ item.dest_name | default(ca_source | basename) }}"
  ansible.builtin.copy:
    src: "{{ ca_source }}"
    dest: "/usr/local/share/ca-certificates/{{ ca_name }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ ca_certificates }}"
  when: not (ca_source is match('^https?://'))
  notify: Update CA certificates (Debian)
